version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: postgres_buildmas
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: buildmas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend_buildmas
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/buildmas

  frontend:
    build: ./frontend
    container_name: frontend_buildmas
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
